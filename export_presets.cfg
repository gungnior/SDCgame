; Android 导出预设 —— M0 真机验证用
;
; 决策依据（specs/tech-stack.md）：
;   T-02  渲染器 Compatibility —— project.godot 里已有 rendering_method.mobile 覆盖
;   T-22  只保留 arm64-v8a（满足 Play/国内渠道的 64 位要求）
;   D-16  不申请 INTERNET 权限（本项目零网络请求）
;
; ⚠️ 首次导出前必须：项目 → 安装 Android 构建模板（或让 Godot 用预编译 APK）
; 导出命令：
;   godot --headless --path . --export-debug "Android" build/soudache-m0.apk

